
default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
  host: db
  port: 5432
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  primary:
    <<: *default
    database:  <%= ENV.fetch("POSTGRES_DB", "project_management_development") %>
  queue:
    <<: *default
    database: project_management_development_queue
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: project_management_test

